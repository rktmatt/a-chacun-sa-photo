# Intégration continue pour la Forge des communs numériques éducatifs (GitLab).
# Les runners partagés de la Forge sont sous Linux : vérifications + paquets Linux ici.
# Les installateurs Windows et macOS sont construits par .github/workflows/build.yml (miroir GitHub).

stages: [check, build]

default:
  image: node:22-bookworm
  cache:
    key: { files: [package-lock.json, src-tauri/Cargo.lock] }
    paths: [.npm/, .cargo/, .rustup/, src-tauri/target/]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl file libxdo-dev libssl-dev
      libayatana-appindicator3-dev librsvg2-dev perl > /dev/null
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo" RUSTUP_HOME="$CI_PROJECT_DIR/.rustup" PATH="$CI_PROJECT_DIR/.cargo/bin:$PATH"
    - command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
    - npm ci --cache .npm --prefer-offline

check:
  stage: check
  script:
    - npm run build
    - npm test
    - cd src-tauri && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked && cd ..
    # La liste des licences tierces doit être à jour avec les dépendances.
    - node scripts/third-party-notices.mjs && git diff --exit-code THIRD-PARTY-NOTICES.md

build-linux:
  stage: build
  script:
    - npm run tauri build -- --bundles deb,appimage
  artifacts:
    expire_in: 30 days
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
