[package]
name = "edu-pic"
version = "0.1.0"
description = "Offline school photo sorting"
license = "EUPL-1.2"
edition = "2021"

[lib]
name = "edu_pic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6.0"
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.8.0", features = [] }
tauri-plugin-dialog = "2.3.0"
