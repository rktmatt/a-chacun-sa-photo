# Construction des installateurs sur les trois systèmes (miroir GitHub du dépôt de la Forge).
# Les installateurs ne sont pas encore signés : ajouter les certificats Windows et Apple
# dans les secrets du dépôt quand ils seront disponibles (voir la documentation de tauri-action).
#
# Pull requests (dont Dependabot) : vérifications et tests seulement, sur les trois systèmes.
# Branche main, tags v* et lancement manuel : vérifications puis installateurs.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Vérification des types et construction de l’interface
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run build
      - name: Tests de l’interface
        run: npm test
      - name: Tests Rust
        run: cargo test --locked
        working-directory: src-tauri
      # La liste des licences tierces doit être à jour avec les dépendances.
      # En cas d’échec : node scripts/third-party-notices.mjs, puis committer THIRD-PARTY-NOTICES.md.
      - name: Liste des licences tierces à jour
        if: matrix.platform == 'ubuntu-22.04'
        run: node scripts/third-party-notices.mjs && git diff --exit-code THIRD-PARTY-NOTICES.md

  build:
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installateurs-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.dmg
